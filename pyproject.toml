[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens"
version = "0.1.0"
description = "Audit SaaS and cloud invoices against contracts and emails, with evidence for every finding."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Onam" }]
keywords = ["invoice", "audit", "saas", "spend", "contracts", "accounts-payable", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AdityaOnam/ledgerlens"
Changelog = "https://github.com/AdityaOnam/ledgerlens/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = ["anthropic>=2.8,<3"]
pdf = ["pypdf>=6,<7"]
xlsx = ["openpyxl>=3.1,<4"]
ocr = ["pypdf>=6,<7", "pytesseract>=0.3.13,<0.4", "Pillow>=10,<13"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pypdf>=6,<7", "openpyxl>=3.1,<4"]

[project.scripts]
ledgerlens = "ledgerlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Optional extras: imported lazily, and absent from a plain install.
module = ["anthropic", "anthropic.*", "openpyxl", "openpyxl.*", "pytesseract", "PIL", "PIL.*", "pypdf"]
ignore_missing_imports = true
